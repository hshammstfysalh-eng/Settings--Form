<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account settings</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --text: #1a2233; --muted: #5b667a;
    --border: #c5cddb; --primary: #2956d6; --primary-dark: #1f44b0;
    --error: #b42318; --success-bg: #e8f6ee; --success: #1a6b3c; --focus: #1b3fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #181f2f; --text: #e8ecf5; --muted: #9aa6bd;
      --border: #3a4660; --primary: #5b8aff; --primary-dark: #7da0ff;
      --error: #ff8a80; --success-bg: #12301f; --success: #7ee0a4; --focus: #9bb6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--card); border-radius: 14px;
    padding: 32px; box-shadow: 0 4px 24px rgba(20, 30, 60, .10);
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
  .field { margin-bottom: 20px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .92rem; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--card); border: 1.5px solid var(--border); border-radius: 8px;
  }
  .pw-wrap { display: flex; gap: 8px; }
  .pw-wrap input { flex: 1; }
  input[aria-invalid="true"] { border-color: var(--error); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .error { min-height: 1.3em; margin: 6px 0 0; color: var(--error); font-size: .86rem; }
  .ghost {
    padding: 0 12px; font: inherit; font-size: .85rem; color: var(--text);
    background: transparent; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--primary); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toggle-row .text { flex: 1; }
  .toggle-row label { margin: 0; }
  .toggle-row .hint { margin: 0; color: var(--muted); font-size: .85rem; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    opacity: 0; cursor: pointer; z-index: 1;
  }
  .track {
    position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
  .save {
    width: 100%; margin-top: 8px; padding: 12px; font: inherit; font-weight: 600;
    color: #fff; background: var(--primary); border: 0; border-radius: 8px; cursor: pointer;
  }
  .save:hover:not(:disabled) { background: var(--primary-dark); }
  .save:disabled { opacity: .45; cursor: not-allowed; }
  .success {
    margin-top: 16px; padding: 12px 14px; border-radius: 8px;
    background: var(--success-bg); color: var(--success); font-weight: 600;
  }
  [hidden] { display: none !important; }
  body { padding-bottom: 96px; }
  .skip-bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px;
    display: flex; justify-content: center;
    background: var(--card); border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(20, 30, 60, .08);
  }
  .skip {
    width: 100%; max-width: 460px; padding: 12px; font: inherit; font-weight: 600;
    color: var(--primary); background: transparent; cursor: pointer;
    border: 2px solid var(--primary); border-radius: 8px;
  }
  .skip:hover { background: var(--primary); color: #fff; }
  .thanks { text-align: center; }
  .thanks .badge {
    width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center; background: var(--success-bg); color: var(--success);
  }
  .thanks h2 { margin: 0 0 8px; font-size: 1.6rem; outline: none; }
  .thanks p { margin: 0 0 12px; color: var(--muted); }
  .thanks p.success { color: var(--success); margin: 0 0 12px; }
  .thanks .summary {
    margin: 20px 0; padding: 14px; border-radius: 10px; text-align: left;
    background: var(--bg); font-size: .93rem; color: var(--text);
  }
  .thanks .summary div + div { margin-top: 6px; }
  .thanks .summary span { color: var(--muted); }
  .thanks .ghost { padding: 10px 18px; }
</style>
</head>
<body>
<main class="card" id="form-view">
  <h1>Account settings</h1>
  <p class="sub">Update your profile and notification preferences.</p>

  <form id="settings" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name"
             aria-describedby="name-error" aria-invalid="false" required>
      <p class="error" id="name-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email"
             aria-describedby="email-error" aria-invalid="false" required>
      <p class="error" id="email-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" autocomplete="new-password"
               aria-describedby="password-hint password-error" aria-invalid="false" required>
        <button type="button" class="ghost" id="pw-toggle" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <p class="error" id="password-error" role="alert"></p>
    </div>

    <div class="field toggle-row">
      <div class="text">
        <label for="notifications">Email notifications</label>
        <p class="hint" id="notifications-hint">Get updates about activity on your account.</p>
      </div>
      <span class="switch">
        <input type="checkbox" id="notifications" name="notifications" role="switch"
               aria-describedby="notifications-hint">
        <span class="track" aria-hidden="true"></span>
      </span>
    </div>

    <button type="submit" class="save" id="save" disabled>Save changes</button>
  </form>
</main>

<div class="skip-bar" id="skip-bar">
  <button type="button" class="skip" id="skip-btn">Go to the next page</button>
</div>

<main class="card thanks" id="thanks-view" hidden>
  <div class="badge" aria-hidden="true">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h2 id="thanks-title" tabindex="-1"></h2>
  <p class="success" id="success" role="status">Your settings were saved successfully.</p>
  <p>Thank you for choosing to join this program. We're glad to have you with us.</p>
  <div class="summary" aria-label="Your saved details">
    <div><span>Name:</span> <strong id="s-name"></strong></div>
    <div><span>Email:</span> <strong id="s-email"></strong></div>
    <div><span>Notifications:</span> <strong id="s-notif"></strong></div>
  </div>
  <button type="button" class="ghost" id="edit-btn">Edit my settings</button>
</main>

<script>
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Validation = factory();
})(typeof self !== "undefined" ? self : this, function () {
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
  const MIN_PASSWORD = 8;

  function validateName(value) {
    if (typeof value !== "string" || value.trim() === "") return "Name is required.";
    return "";
  }

  function validateEmail(value) {
    const v = typeof value === "string" ? value.trim() : "";
    if (v === "") return "Email is required.";
    if (v.includes("..") || v.startsWith(".") || !EMAIL_RE.test(v))
      return "Enter a valid email address, like name@example.com.";
    return "";
  }

  function validatePassword(value) {
    if (typeof value !== "string" || value === "") return "Password is required.";
    if (value.length < MIN_PASSWORD)
      return "Password must be at least " + MIN_PASSWORD + " characters.";
    return "";
  }

  function validateForm(values) {
    const errors = {
      name: validateName(values.name),
      email: validateEmail(values.email),
      password: validatePassword(values.password),
    };
    return { errors, valid: Object.values(errors).every((e) => e === "") };
  }

  return { validateName, validateEmail, validatePassword, validateForm, MIN_PASSWORD };
});
</script>
<script>
(function () {
  const form = document.getElementById("settings");
  const saveBtn = document.getElementById("save");
  const formView = document.getElementById("form-view");
  const thanksView = document.getElementById("thanks-view");
  const fields = ["name", "email", "password"];
  const validators = {
    name: Validation.validateName,
    email: Validation.validateEmail,
    password: Validation.validatePassword,
  };
  const touched = { name: false, email: false, password: false };

  const el = (id) => document.getElementById(id);
  const values = () => ({ name: el("name").value, email: el("email").value, password: el("password").value });

  function renderField(f) {
    const msg = touched[f] ? validators[f](el(f).value) : "";
    el(f + "-error").textContent = msg;
    el(f).setAttribute("aria-invalid", msg ? "true" : "false");
  }

  function refresh() {
    saveBtn.disabled = !Validation.validateForm(values()).valid;
  }

  function touchAll() {
    fields.forEach((f) => { touched[f] = true; renderField(f); });
    const firstBad = fields.find((f) => validators[f](el(f).value));
    if (firstBad) el(firstBad).focus();
  }

  fields.forEach((f) => {
    el(f).addEventListener("blur", () => { touched[f] = true; renderField(f); });
    el(f).addEventListener("input", () => {
      if (touched[f]) renderField(f);
      refresh();
    });
  });

  el("pw-toggle").addEventListener("click", (e) => {
    const pw = el("password");
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "Hide" : "Show";
    e.currentTarget.setAttribute("aria-pressed", String(show));
  });

  // Browsers block Enter-to-submit while Save is disabled, so reveal errors ourselves.
  form.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox" && saveBtn.disabled) {
      e.preventDefault();
      touchAll();
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    touchAll();
    if (!Validation.validateForm(values()).valid) return;
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    setTimeout(() => {          // simulated save request
      saveBtn.textContent = "Save changes";
      refresh();
      location.hash = "thanks";
    }, 400);
  });

  // Next step: move the user to a thank-you screen after a successful save.
  function fillThanks() {
    const v = values();
    const firstName = v.name.trim().split(/\s+/)[0];
    el("thanks-title").textContent = firstName ? "Thank you, " + firstName + "!" : "Thank you!";
    el("s-name").textContent = v.name.trim() || "—";
    el("s-email").textContent = v.email.trim() || "—";
    el("s-notif").textContent = el("notifications").checked ? "On" : "Off";
  }

  // Tiny hash router: "#thanks" is the thank-you page, anything else is the form.
  function route(moveFocus) {
    const onThanks = location.hash === "#thanks";
    if (onThanks) fillThanks();
    formView.hidden = onThanks;
    el("skip-bar").hidden = onThanks;
    thanksView.hidden = !onThanks;
    if (moveFocus) (onThanks ? el("thanks-title") : el("name")).focus();
  }
  window.addEventListener("hashchange", () => route(true));

  el("skip-btn").addEventListener("click", () => { location.hash = "thanks"; });  // no validation, any data
  el("edit-btn").addEventListener("click", () => { location.hash = "form"; });

  refresh();
  route(false);
})();
</script>
</body>
</html>
